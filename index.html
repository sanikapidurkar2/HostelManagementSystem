<!DOCTYPE html>
<html>
<head>
    <title>Hostel Management System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        .header {
            background-color: #243447;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            padding: 30px;
        }

        .welcome {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background-color: white;
            width: 200px;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        .card h2 {
            color: #243447;
        }

        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #243447;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Hostel Management System</h1>
        <p>Student Hostel Administration Portal</p>
    </div>

    <div class="container">

        <div class="welcome">
            <h2>Welcome to Hostel Management System</h2>
            <p>Manage students, rooms and hostel fees easily.</p>
        </div>

        <div class="cards">

            <div class="card">
                <h2>Students</h2>
                <p>Manage student records</p>
                <a href="#" class="button">View</a>
            </div>

            <div class="card">
                <h2>Rooms</h2>
                <p>Manage room allocation</p>
                <a href="#" class="button">View</a>
            </div>

            <div class="card">
                <h2>Fees</h2>
                <p>Manage hostel fees</p>
                <a href="#" class="button">View</a>
            </div>

            <div class="card">
                <h2>Reports</h2>
                <p>View hostel reports</p>
                <a href="#" class="button">View</a>
            </div>

        </div>

    </div>

</body>
</html>
